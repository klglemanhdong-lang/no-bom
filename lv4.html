<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Survival Professional - Level 4 Cyber Hex</title>
    <style>
        :root {
            --p1-color: #3333ff;
            --p2-color: #ff3333;
            --accent-yellow: #ffff00;
            --cyber-cyan: #00f3ff;
            --cyber-orange: #ff0055;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Orbitron', sans-serif; /* Font mang tính tương lai */
        }

        .game-viewport {
            position: relative;
            width: 100vw; height: 56.25vw;
            max-height: 100vh; max-width: 177.78vh;
            margin: auto; top: 50%;
            transform: translateY(-50%);
            background: #050505;
            overflow: hidden;
            border: 2px solid #222;
        }

        #bg-video {
            position: absolute; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; opacity: 0.6;
        }

        .ui-layer {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            pointer-events: none;
        }

        /* --- ANIMATIONS --- */
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        /* Hiệu ứng tia Laser quét */
        @keyframes laserScan {
            0% { top: -100%; }
            100% { top: 200%; }
        }

        /* Hiệu ứng Hexagon rung nhẹ */
        @keyframes hexFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        @keyframes activeBlink { 50% { opacity: 0.4; } }

        /* --- PLAYERS --- */
        .player-container {
            position: absolute; bottom: 10%;
            display: flex; flex-direction: column; align-items: center;
            z-index: 5;
            transition: all 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045);
        }
        .p1-side { left: 5%; }
        .p2-side { right: 5%; }

        .bomb-wrapper { position: relative; width: 260px; height: 260px; }
        .bomb-img { width: 100%; animation: heartBeat 0.8s infinite ease-in-out; }

        .explosion-vid {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; display: none;
            mix-blend-mode: screen; z-index: 20;
        }

        .character-img { width: 210px; margin-top: -70px; }

        .player-name {
            padding: 10px 30px; font-size: 24px; font-weight: bold;
            color: white; margin-bottom: 15px; border-radius: 5px;
            border: 3px solid transparent; pointer-events: auto;
        }
        .p1-label { background: var(--p1-color); box-shadow: 0 0 15px var(--p1-color); }
        .p2-label { background: var(--p2-color); box-shadow: 0 0 15px var(--p2-color); }
        .is-active { animation: activeBlink 0.5s infinite; border-color: var(--accent-yellow); box-shadow: 0 0 25px var(--accent-yellow); }

        /* --- CENTER UI & GRID --- */
        .center-ui { display: flex; flex-direction: column; align-items: center; margin-top: 25px; pointer-events: auto; }
        .level-text { font-size: 85px; color: #fff; margin: 0; text-shadow: 0 0 20px var(--cyber-cyan); }

        .timer-box { width: 520px; height: 35px; background: #111; border: 2px solid var(--cyber-cyan); border-radius: 5px; margin: 20px 0; overflow: hidden; position: relative; }
        #timer-fill { width: 100%; height: 100%; background: var(--cyber-cyan); box-shadow: 0 0 15px var(--cyber-cyan); }

        .grid-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }

        /* NÚT SỐ HÌNH LỤC GIÁC CYBERPUNK */
        .grid-btn { 
            position: relative; 
            width: 100px; height: 115px; 
            background: rgba(0, 243, 255, 0.1);
            color: var(--cyber-cyan); font-size: 30px; font-weight: bold;
            border: none;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            cursor: pointer; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            border: 1px solid var(--cyber-cyan);
            animation: hexFloat 3s infinite ease-in-out;
            transition: all 0.2s;
        }

        /* Tia Laser quét ngang nút */
        .grid-btn::before {
            content: "";
            position: absolute;
            width: 100%; height: 5px;
            background: var(--cyber-cyan);
            box-shadow: 0 0 15px var(--cyber-cyan);
            opacity: 0.5;
            animation: laserScan 2s infinite linear;
        }

        .grid-btn:hover { 
            background: var(--cyber-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--cyber-cyan);
        }

        .grid-btn.used {
            background: #222 !important;
            color: #444 !important;
            border-color: #444 !important;
        }

        .grid-btn.used::after {
            content: "X";
            position: absolute; 
            color: var(--cyber-orange); font-size: 60px; font-weight: 900;
            z-index: 10;
        }

        /* --- OVERLAYS --- */
        .overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.95); color: white; }
        .win-title { font-size: 95px; color: var(--cyber-cyan); text-shadow: 0 0 30px var(--cyber-cyan); margin-bottom: 25px; }
        .btn-action { padding: 20px 60px; font-size: 28px; font-weight: bold; background: none; color: var(--cyber-cyan); border: 2px solid var(--cyber-cyan); border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { background: var(--cyber-cyan); color: #000; box-shadow: 0 0 40px var(--cyber-cyan); }
    </style>
</head>
<body>

<div class="game-viewport">
    <video id="bg-video" loop muted><source src="nendong.mp4" type="video/mp4"></video>

    <div id="start-screen" class="overlay">
        <button id="btn-ready" class="btn-action">INITIALIZE LEVEL 4</button>
    </div>

    <div id="win-screen" class="overlay" style="display: none;">
        <h1 id="winner-name" class="win-title">SYSTEM SECURED</h1>
        <button onclick="window.location.href='lv5.html'" class="btn-action">PROCEED TO LV5</button>
    </div>

    <div class="ui-layer">
        <div class="center-ui">
            <h1 class="level-text">LEVEL 04</h1>
            <div class="timer-box"><div id="timer-fill"></div></div>
            <div class="grid-layout" id="number-grid"></div>
        </div>
    </div>

    <div class="player-container p1-side" id="p1-unit">
        <div class="player-name p1-label" id="name-1">USER_01</div>
        <div class="bomb-wrapper">
            <img src="bom1.png" class="bomb-img" id="bomb-p1">
            <video class="explosion-vid" id="vid-no-1" muted><source src="no.mp4" type="video/mp4"></video>
        </div>
        <img src="nguoi1.png" class="character-img">
    </div>

    <div class="player-container p2-side" id="p2-unit">
        <div class="player-name p2-label" id="name-2">USER_02</div>
        <div class="bomb-wrapper">
            <img src="bom2.png" class="bomb-img" id="bomb-p2">
            <video class="explosion-vid" id="vid-no-2" muted><source src="no.mp4" type="video/mp4"></video>
        </div>
        <img src="nguoi2.png" class="character-img">
    </div>
</div>

<audio id="audio-bg" loop><source src="nhac-nen.mp3" type="audio/mpeg"></audio>
<audio id="audio-bomb"><source src="bomb.mp3" type="audio/mpeg"></audio>
<audio id="audio-correct"><source src="dung.mp3" type="audio/mpeg"></audio>

<script>
const GameEngine = (() => {
    const DEATH_VAL = 4; // Ô kích nổ Level 4 là số 4
    const MAX_TIME = 150; 
    
    let state = {
        currentPlayer: 1,
        timeLeft: MAX_TIME,
        isActive: false,
        timer: null
    };

    const dom = {
        timerFill: document.getElementById('timer-fill'),
        grid: document.getElementById('number-grid'),
        labels: [null, document.getElementById('name-1'), document.getElementById('name-2')],
        units: [null, document.getElementById('p1-unit'), document.getElementById('p2-unit')],
        bombImgs: [null, document.getElementById('bomb-p1'), document.getElementById('bomb-p2')],
        expVids: [null, document.getElementById('vid-no-1'), document.getElementById('vid-no-2')],
        sfx: {
            bg: document.getElementById('audio-bg'),
            bomb: document.getElementById('audio-bomb'),
            correct: document.getElementById('audio-correct')
        }
    };

    const initGrid = () => {
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('div');
            btn.className = 'grid-btn';
            btn.innerText = i.toString().padStart(2, '0');
            btn.style.animationDelay = (Math.random() * 2) + 's';
            btn.onclick = () => handleChoice(i, btn);
            dom.grid.appendChild(btn);
        }
    };

    const startTurn = () => {
        if (!state.isActive) return;
        dom.labels[1].classList.toggle('is-active', state.currentPlayer === 1);
        dom.labels[2].classList.toggle('is-active', state.currentPlayer === 2);
        state.timeLeft = MAX_TIME;
        clearInterval(state.timer);
        state.timer = setInterval(tick, 100);
    };

    const tick = () => {
        state.timeLeft--;
        dom.timerFill.style.width = (state.timeLeft / MAX_TIME * 100) + '%';
        if (state.timeLeft <= 0) triggerExplosion();
    };

    const handleChoice = (val, btn) => {
        if (!state.isActive || btn.classList.contains('used')) return;
        btn.classList.add('used');
        btn.style.animation = 'none';

        if (val === DEATH_VAL) {
            triggerExplosion();
        } else {
            dom.sfx.correct.currentTime = 0;
            dom.sfx.correct.play();
            state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
            startTurn();
        }
    };

    const triggerExplosion = () => {
        state.isActive = false;
        clearInterval(state.timer);
        dom.sfx.bg.pause();
        dom.sfx.bomb.play();

        const p = state.currentPlayer;
        dom.bombImgs[p].style.visibility = 'hidden';
        dom.expVids[p].style.display = 'block';
        dom.expVids[p].play();

        setTimeout(() => {
            dom.units[p].style.transform = `translateY(-600px) rotate(${p === 1 ? -90 : 90}deg)`;
            dom.units[p].style.opacity = '0';
        }, 200);

        setTimeout(() => {
            const winner = p === 1 ? "USER_02" : "USER_01";
            document.getElementById('winner-name').innerText = `${winner} WIN`;
            document.getElementById('win-screen').style.display = 'flex';
        }, 2500);
    };

    return {
        boot: () => {
            initGrid();
            document.getElementById('btn-ready').onclick = () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('bg-video').play();
                dom.sfx.bg.volume = 0.3;
                dom.sfx.bg.play();
                state.isActive = true;
                startTurn();
            };
        }
    };
})();

window.onload = GameEngine.boot;
</script>
</body>
</html>
