<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Survival - LEVEL 11 FIXED</title>
    <style>
        :root {
            --p1-color: #3333ff; --p2-color: #ff3333;
            --fire-color: #ff4500; --gold: #ffd700;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Impact', sans-serif; }
        
        .game-viewport { 
            position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; 
            margin: auto; top: 50%; transform: translateY(-50%); 
            background: radial-gradient(circle, #300 0%, #000 100%);
            overflow: hidden; border: 5px solid var(--fire-color);
        }

        #bg-video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.3; filter: sepia(1) saturate(3); }

        /* Hiệu ứng xoay của viền (không ảnh hưởng đến vùng nhấn) */
        @keyframes borderRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .player-container { position: absolute; bottom: 8%; display: flex; flex-direction: column; align-items: center; z-index: 5; transition: all 0.4s; }
        .p1-side { left: 3%; } .p2-side { right: 3%; }
        .bomb-wrapper { position: relative; width: 280px; height: 280px; }
        .bomb-img { width: 100%; animation: heartBeat 0.4s infinite linear; }
        @keyframes heartBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        
        .player-name { padding: 10px 30px; font-size: 24px; font-weight: bold; color: white; border-radius: 50px; }
        .is-active { animation: blinkActive 0.3s infinite; box-shadow: 0 0 40px #fff; border: 2px solid #fff; }
        @keyframes blinkActive { 50% { transform: scale(1.1); } }

        .center-ui { display: flex; flex-direction: column; align-items: center; margin-top: 10px; z-index: 10; pointer-events: auto; }
        .level-text { font-size: 80px; color: var(--gold); margin: 0; text-shadow: 0 0 20px #f00; }
        .status-msg { color: #fff; font-size: 20px; background: rgba(255,0,0,0.6); padding: 5px 25px; border-radius: 5px; margin-bottom: 5px; border-left: 5px solid yellow; }

        .timer-box { width: 500px; height: 35px; background: #222; border: 3px solid var(--fire-color); border-radius: 5px; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f00, #ff8c00, #f00); }

        .grid-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }

        /* NÚT SỐ - ĐÃ FIX VÙNG NHẤN */
        .grid-btn { 
            position: relative; width: 100px; height: 100px; 
            background: transparent; border: none; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            padding: 0; outline: none;
        }

        /* Lớp viền xoay phía dưới */
        .btn-bg-rotate {
            position: absolute; inset: 0;
            background: #111; border: 3px solid #f00;
            box-shadow: 0 0 15px #f00;
            animation: borderRotate 4s infinite linear;
            z-index: 1;
        }

        /* Lớp số cố định phía trên để dễ bấm */
        .btn-text-content {
            position: relative; z-index: 2;
            color: var(--gold); font-size: 35px; font-weight: bold;
            pointer-events: none; /* Để click xuyên qua trúng vào btn chính */
        }

        .grid-btn.used { opacity: 0.1; cursor: default; }
        .grid-btn.used .btn-bg-rotate { animation: none; border-color: #333; box-shadow: none; }
        .grid-btn.used::after { content: "X"; position: absolute; color: white; font-size: 70px; z-index: 5; }

        .overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.95); color: white; text-align: center; }
        .btn-action { padding: 25px 60px; font-size: 30px; background: #f00; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body id="main-body">
    <div class="game-viewport">
        <video id="bg-video" loop muted><source src="nendong.mp4" type="video/mp4"></video>
        
        <div id="start-screen" class="overlay">
            <h1 style="font-size: 70px; color: #f00;">LV-11: NIGHTMARE</h1>
            <p style="font-size: 22px;">CHỌN 2 Ô MỖI LƯỢT - 2 QUẢ BOM ẨN GIẤU</p>
            <button id="btn-ready" class="btn-action">VÀO SINH RA TỬ</button>
        </div>

        <div id="win-screen" class="overlay" style="display: none;">
            <h1 style="font-size: 80px; color: gold;">BẤT TỬ!</h1>
            <button onclick="window.location.href='lv12.html'" class="btn-action">QUA LEVEL 12</button>
        </div>

        <div class="ui-layer">
            <div class="center-ui">
                <h1 class="level-text">LEVEL 11</h1>
                <div id="status-display" class="status-msg">Lượt: Người chơi 1 (Chọn 2 ô)</div>
                <div class="timer-box"><div id="timer-fill"></div></div>
                <div class="grid-layout" id="number-grid"></div>
            </div>
        </div>

        <div class="player-container p1-side" id="p1-unit">
            <div class="player-name" style="background:var(--p1-color)" id="name-1">USER 01</div>
            <div class="bomb-wrapper">
                <img src="bom1.png" class="bomb-img" id="bomb-p1">
                <video class="explosion-vid" id="vid-no-1" muted style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:600px; display:none; mix-blend-mode:screen;"><source src="no.mp4" type="video/mp4"></video>
            </div>
            <img src="nguoi1.png" style="width:230px; margin-top:-80px;">
        </div>

        <div class="player-container p2-side" id="p2-unit">
            <div class="player-name" style="background:var(--p2-color)" id="name-2">USER 02</div>
            <div class="bomb-wrapper">
                <img src="bom2.png" class="bomb-img" id="bomb-p2">
                <video class="explosion-vid" id="vid-no-2" muted style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:600px; display:none; mix-blend-mode:screen;"><source src="no.mp4" type="video/mp4"></video>
            </div>
            <img src="nguoi2.png" style="width:230px; margin-top:-80px;">
        </div>
    </div>

    <audio id="audio-bg" loop><source src="nhac-nen.mp3" type="audio/mpeg"></audio>
    <audio id="audio-bomb"><source src="bomb.mp3" type="audio/mpeg"></audio>
    <audio id="audio-correct"><source src="dung.mp3" type="audio/mpeg"></audio>

<script>
const GameEngine = (() => {
    // RANDOM 2 SỐ TỬ THẦN
    let DEATH_VALS = [];
    while(DEATH_VALS.length < 2) {
        let r = Math.floor(Math.random() * 9) + 1;
        if(DEATH_VALS.indexOf(r) === -1) DEATH_VALS.push(r);
    }
    
    const MAX_TIME = 150; 
    let state = { currentPlayer: 1, timeLeft: MAX_TIME, isActive: false, timer: null, clicksLeft: 2 };
    
    const dom = {
        timerFill: document.getElementById('timer-fill'), 
        grid: document.getElementById('number-grid'),
        status: document.getElementById('status-display'),
        labels: [null, document.getElementById('name-1'), document.getElementById('name-2')],
        units: [null, document.getElementById('p1-unit'), document.getElementById('p2-unit')],
        bombImgs: [null, document.getElementById('bomb-p1'), document.getElementById('bomb-p2')],
        expVids: [null, document.getElementById('vid-no-1'), document.getElementById('vid-no-2')],
        sfx: { bg: document.getElementById('audio-bg'), bomb: document.getElementById('audio-bomb'), correct: document.getElementById('audio-correct') }
    };

    const initGrid = () => {
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'grid-btn';
            btn.innerHTML = `
                <div class="btn-bg-rotate"></div>
                <div class="btn-text-content">${i.toString().padStart(2, '0')}</div>
            `;
            btn.onclick = () => handleChoice(i, btn);
            dom.grid.appendChild(btn);
        }
    };

    const startTurn = () => {
        if (!state.isActive) return;
        state.clicksLeft = 2;
        updateStatus();
        dom.labels[1].classList.toggle('is-active', state.currentPlayer === 1);
        dom.labels[2].classList.toggle('is-active', state.currentPlayer === 2);
        state.timeLeft = MAX_TIME;
        clearInterval(state.timer);
        state.timer = setInterval(tick, 100);
    };

    const tick = () => {
        state.timeLeft--;
        dom.timerFill.style.width = (state.timeLeft / MAX_TIME * 100) + '%';
        if (state.timeLeft <= 0) triggerExplosion();
    };

    const updateStatus = () => {
        dom.status.innerText = `Lượt: Người chơi ${state.currentPlayer} (Còn ${state.clicksLeft} lần chọn)`;
    };

    const handleChoice = (val, btn) => {
        if (!state.isActive || btn.classList.contains('used')) return;
        
        if (DEATH_VALS.includes(val)) {
            btn.classList.add('used');
            triggerExplosion();
        } else {
            btn.classList.add('used');
            dom.sfx.correct.currentTime = 0; dom.sfx.correct.play();
            state.clicksLeft--;
            
            if(state.clicksLeft === 0) {
                state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
                startTurn();
            } else {
                updateStatus();
            }
        }
    };

    const triggerExplosion = () => {
        state.isActive = false; clearInterval(state.timer);
        dom.sfx.bg.pause(); dom.sfx.bomb.play();
        const p = state.currentPlayer;
        dom.bombImgs[p].style.visibility = 'hidden';
        dom.expVids[p].style.display = 'block'; dom.expVids[p].play();
        setTimeout(() => {
            dom.units[p].style.transform = `translateY(-700px) rotate(180deg)`;
            dom.units[p].style.opacity = '0';
        }, 200);
        setTimeout(() => {
            document.getElementById('winner-name').innerText = (p === 1 ? "USER 02" : "USER 01") + " THẮNG!";
            document.getElementById('win-screen').style.display = 'flex';
        }, 2500);
    };

    return {
        boot: () => {
            initGrid();
            document.getElementById('btn-ready').onclick = () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('bg-video').play();
                dom.sfx.bg.volume = 0.3; dom.sfx.bg.play();
                state.isActive = true; startTurn();
            };
        }
    };
})();
window.onload = GameEngine.boot;
</script>
</body>
</html>
