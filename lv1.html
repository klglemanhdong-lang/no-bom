<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Survival - Level 1</title>
    <style>
        :root {
            --primary-red: #ff3333;
            --primary-blue: #3333ff;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial', sans-serif;
        }

        .game-viewport {
            position: relative;
            width: 100vw; height: 56.25vw;
            max-height: 100vh; max-width: 177.78vh;
            margin: auto; top: 50%;
            transform: translateY(-50%);
            overflow: hidden;
            border: 2px solid #333;
        }

        #bg-video {
            position: absolute; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        .ui-layer {
            position: absolute; inset: 0; z-index: 5;
            display: flex; flex-direction: column; align-items: center;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .player-container {
            position: absolute; bottom: 10%;
            display: flex; flex-direction: column; align-items: center;
            z-index: 4;
            transition: all 0.8s ease-in;
        }

        .p1-side { left: 5%; }
        .p2-side { right: 5%; }

        .bomb-wrapper { position: relative; width: 250px; height: 250px; }

        .bomb {
            width: 100%;
            animation: heartBeat 0.8s infinite ease-in-out;
        }

        .explosion-video {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; z-index: 10;
            display: none; mix-blend-mode: screen;
        }

        .character { width: 200px; margin-top: -60px; }

        .player-label {
            padding: 10px 30px; font-size: 22px; font-weight: bold;
            color: white; margin-bottom: 15px; border-radius: 8px;
            border: 3px solid transparent;
        }
        .p1-label { background: var(--primary-blue); }
        .p2-label { background: var(--primary-red); }

        .active-turn {
            animation: blinker 0.5s linear infinite;
            box-shadow: 0 0 20px yellow;
            border-color: yellow;
        }

        @keyframes blinker { 50% { opacity: 0.3; } }

        .center-board { 
            display: flex; flex-direction: column; align-items: center;
            margin-top: 20px; 
        }

        .level-title { font-size: 80px; color: white; margin: 0; text-shadow: 4px 4px 0px #000; }

        .timer-container {
            width: 500px; height: 30px;
            background: #222; border: 3px solid #ff0077;
            border-radius: 20px; margin: 20px 0; overflow: hidden;
        }

        #timer-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0000, #ffbb00); transition: width 0.1s linear; }

        .number-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }

        .num-btn { 
            position: relative; width: 90px; height: 90px; 
            background: #444; color: white; font-size: 28px; 
            border: none; cursor: pointer; border-bottom: 5px solid #222;
        }

        .num-btn.selected::after {
            content: "X";
            position: absolute; inset: 0;
            display: flex; justify-content: center; align-items: center;
            color: #ff0000; font-size: 60px; font-weight: bold;
            background: rgba(0,0,0,0.6);
        }

        #win-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 100; display: none; flex-direction: column;
            justify-content: center; align-items: center; color: white;
        }

        .win-title { font-size: 90px; color: #ffd700; text-shadow: 0 0 30px #ffcc00; margin-bottom: 20px; }

        #start-screen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 110; display: flex; justify-content: center; align-items: center;
        }

        .btn-ready { padding: 25px 70px; font-size: 35px; background: red; color: white; border: none; cursor: pointer; border-radius: 10px; }
        .btn-next { padding: 15px 50px; font-size: 25px; background: #28a745; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 0 #155d27; }
    </style>
</head>
<body>

<div class="game-viewport">
    <video id="bg-video" loop muted><source src="nendong.mp4" type="video/mp4"></video>

    <div id="start-screen">
        <button id="ready-btn" class="btn-ready">SẴN SÀNG</button>
    </div>

    <div id="win-overlay">
        <div style="text-align: center;">
            <h1 id="win-text" class="win-title">NGƯỜI CHƠI 1 WIN</h1>
            <button onclick="window.location.href='lv2.html'" class="btn-next">QUA LEVEL 2</button>
        </div>
    </div>

    <div class="ui-layer">
        <div class="center-board">
            <h1 class="level-title">Level 1</h1>
            <div class="timer-container"><div id="timer-bar"></div></div>
            <div class="number-grid" id="grid"></div>
        </div>
    </div>

    <div class="player-container p1-side" id="p1-wrap">
        <div class="player-label p1-label" id="label-p1">Người chơi 1</div>
        <div class="bomb-wrapper">
            <img src="bom1.png" class="bomb" id="bomb-img-1">
            <video class="explosion-video" id="exp-1" muted><source src="no.mp4" type="video/mp4"></video>
        </div>
        <img src="nguoi1.png" class="character">
    </div>

    <div class="player-container p2-side" id="p2-wrap">
        <div class="player-label p2-label" id="label-p2">Người chơi 2</div>
        <div class="bomb-wrapper">
            <img src="bom2.png" class="bomb" id="bomb-img-2">
            <video class="explosion-video" id="exp-2" muted><source src="no.mp4" type="video/mp4"></video>
        </div>
        <img src="nguoi2.png" class="character">
    </div>
</div>

<audio id="bg-music" loop><source src="nhac-nen.mp3" type="audio/mpeg"></audio>
<audio id="sfx-bomb"><source src="bomb.mp3" type="audio/mpeg"></audio>
<audio id="sfx-correct"><source src="dung.mp3" type="audio/mpeg"></audio>

<script>
    const DEATH_NUMBER = 8;
    const TURN_TIME = 15; 
    let currentPlayer = 1;
    let timeLeft = TURN_TIME * 10;
    let gameActive = false;
    let timerInterval;

    const bgMusic = document.getElementById('bg-music');
    const bombAudio = document.getElementById('sfx-bomb');
    const sfxCorrect = document.getElementById('sfx-correct');
    const timerBar = document.getElementById('timer-bar');

    const grid = document.getElementById('grid');
    for (let i = 1; i <= 9; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i < 10 ? '0' + i : i;
        btn.onclick = () => handleMove(i, btn);
        grid.appendChild(btn);
    }

    document.getElementById('ready-btn').onclick = function() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('bg-video').play();
        bgMusic.volume = 0.3; 
        bgMusic.play();
        gameActive = true;
        startTurn();
    };

    function startTurn() {
        if (!gameActive) return;
        document.getElementById('label-p1').classList.toggle('active-turn', currentPlayer === 1);
        document.getElementById('label-p2').classList.toggle('active-turn', currentPlayer === 2);
        
        timeLeft = TURN_TIME * 10; 
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            timerBar.style.width = (timeLeft / (TURN_TIME * 10) * 100) + '%';
            if (timeLeft <= 0) explode();
        }, 100);
    }

    function handleMove(num, btn) {
        if (!gameActive || btn.classList.contains('selected')) return;
        btn.classList.add('selected');
        btn.disabled = true;

        if (num === DEATH_NUMBER) {
            explode();
        } else {
            sfxCorrect.currentTime = 0;
            sfxCorrect.play();
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            startTurn();
        }
    }

    function explode() {
        gameActive = false;
        clearInterval(timerInterval);
        bgMusic.pause();
        
        // Phát âm thanh nổ gốc
        bombAudio.volume = 1.0; 
        bombAudio.play();

        const expVideo = document.getElementById(`exp-${currentPlayer}`);
        const bombImg = document.getElementById(`bomb-img-${currentPlayer}`);
        
        bombImg.style.visibility = 'hidden'; 
        expVideo.style.display = 'block';
        expVideo.play();

        setTimeout(() => {
            const loser = document.getElementById(`p${currentPlayer}-wrap`);
            loser.style.transform = "translateY(-600px) rotate(90deg)";
            loser.style.opacity = "0";
        }, 200);

        setTimeout(() => {
            const winner = (currentPlayer === 1) ? "NGƯỜI CHƠI 2" : "NGƯỜI CHƠI 1";
            document.getElementById('win-text').innerText = winner + " WIN";
            document.getElementById('win-overlay').style.display = 'flex';
        }, 2500);
    }
</script>
</body>
</html>
