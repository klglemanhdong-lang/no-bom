<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Survival - Level 6 Random</title>
    <style>
        /* GIỮ NGUYÊN CSS KHUNG VÀ HIỆU ỨNG TỪ LV5 */
        :root {
            --p1-color: #3333ff; --p2-color: #ff3333; --accent-yellow: #ffff00;
            --hole-bg: #000; --hole-border: #00ff00; /* Xanh lá neon cực độc */
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        .game-viewport { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; top: 50%; transform: translateY(-50%); background: #050505; overflow: hidden; border: 2px solid #00ff00; }
        #bg-video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.4; }
        .ui-layer { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; pointer-events: none; }

        /* Animation xoáy tròn cho nút */
        @keyframes holeSpin {
            0% { transform: rotate(0deg) scale(1); box-shadow: 0 0 10px #0f0; }
            50% { transform: rotate(180deg) scale(1.1); box-shadow: 0 0 25px #0f0; }
            100% { transform: rotate(360deg) scale(1); box-shadow: 0 0 10px #0f0; }
        }

        /* GIỮ CÁC CSS CŨ CHO PLAYER, BOMB, VIDEO NỔ... */
        .player-container { position: absolute; bottom: 10%; display: flex; flex-direction: column; align-items: center; z-index: 5; transition: all 0.8s; }
        .p1-side { left: 5%; } .p2-side { right: 5%; }
        .bomb-wrapper { position: relative; width: 260px; height: 260px; }
        .bomb-img { width: 100%; animation: heartBeat 0.8s infinite; }
        @keyframes heartBeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .explosion-vid { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; display: none; mix-blend-mode: screen; z-index: 20; }
        .character-img { width: 210px; margin-top: -70px; }
        .player-name { padding: 10px 30px; font-size: 24px; font-weight: bold; color: white; margin-bottom: 15px; border-radius: 5px; border: 3px solid transparent; pointer-events: auto; }
        .p1-label { background: var(--p1-color); } .p2-label { background: var(--p2-color); }
        .is-active { animation: activeBlink 0.5s infinite; border-color: var(--accent-yellow); box-shadow: 0 0 25px var(--accent-yellow); }
        @keyframes activeBlink { 50% { opacity: 0.4; } }
        .center-ui { display: flex; flex-direction: column; align-items: center; margin-top: 25px; pointer-events: auto; }
        .level-text { font-size: 85px; color: #fff; margin: 0; text-shadow: 0 0 20px #0f0; }
        .timer-box { width: 520px; height: 35px; background: #111; border: 2px solid #0f0; border-radius: 20px; margin: 20px 0; overflow: hidden; }
        #timer-fill { width: 100%; height: 100%; background: #0f0; }
        .grid-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }

        /* NÚT SỐ XOÁY RANDOM */
        .grid-btn { 
            position: relative; width: 100px; height: 100px; background: #000; color: #0f0; font-size: 30px; font-weight: bold;
            border: 2px solid #0f0; border-radius: 50%; cursor: pointer;
            animation: holeSpin 4s infinite linear; display: flex; justify-content: center; align-items: center;
        }
        .btn-text { transform: rotate(0deg); } /* Có thể khóa xoay cho chữ nếu muốn dễ đọc */
        .grid-btn.used::after { content: "X"; position: absolute; color: red; font-size: 60px; z-index: 10; }
        .overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); color: white; }
        .btn-action { padding: 20px 60px; font-size: 28px; background: #00ff00; color: #000; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-viewport">
        <video id="bg-video" loop muted><source src="nendong.mp4" type="video/mp4"></video>
        <div id="start-screen" class="overlay">
            <button id="btn-ready" class="btn-action">KÍCH HOẠT CHẾ ĐỘ NGẪU NHIÊN</button>
        </div>
        <div id="win-screen" class="overlay" style="display: none;">
            <h1 id="winner-name" style="font-size: 80px;">WIN</h1>
            <button onclick="window.location.href='lv7.html'" class="btn-action">QUA LEVEL 7</button>
        </div>
        <div class="ui-layer">
            <div class="center-ui">
                <h1 class="level-text">Level 6</h1>
                <div class="timer-box"><div id="timer-fill"></div></div>
                <div class="grid-layout" id="number-grid"></div>
            </div>
        </div>
        <div class="player-container p1-side" id="p1-unit">
            <div class="player-name p1-label" id="name-1">Người chơi 1</div>
            <div class="bomb-wrapper"><img src="bom1.png" class="bomb-img" id="bomb-p1"><video class="explosion-vid" id="vid-no-1" muted><source src="no.mp4" type="video/mp4"></video></div>
            <img src="nguoi1.png" class="character-img">
        </div>
        <div class="player-container p2-side" id="p2-unit">
            <div class="player-name p2-label" id="name-2">Người chơi 2</div>
            <div class="bomb-wrapper"><img src="bom2.png" class="bomb-img" id="bomb-p2"><video class="explosion-vid" id="vid-no-2" muted><source src="no.mp4" type="video/mp4"></video></div>
            <img src="nguoi2.png" class="character-img">
        </div>
    </div>

    <audio id="audio-bg" loop><source src="nhac-nen.mp3" type="audio/mpeg"></audio>
    <audio id="audio-bomb"><source src="bomb.mp3" type="audio/mpeg"></audio>
    <audio id="audio-correct"><source src="dung.mp3" type="audio/mpeg"></audio>

<script>
const GameEngine = (() => {
    // --- ĐÂY LÀ CHỖ RANDOM ---
    const DEATH_VAL = Math.floor(Math.random() * 9) + 1; 
    console.log("Số tử thần màn này là: " + DEATH_VAL); // Anh có thể F12 để xem lén nếu muốn test
    
    const MAX_TIME = 150; 
    let state = { currentPlayer: 1, timeLeft: MAX_TIME, isActive: false, timer: null };
    const dom = {
        timerFill: document.getElementById('timer-fill'), grid: document.getElementById('number-grid'),
        labels: [null, document.getElementById('name-1'), document.getElementById('name-2')],
        units: [null, document.getElementById('p1-unit'), document.getElementById('p2-unit')],
        bombImgs: [null, document.getElementById('bomb-p1'), document.getElementById('bomb-p2')],
        expVids: [null, document.getElementById('vid-no-1'), document.getElementById('vid-no-2')],
        sfx: { bg: document.getElementById('audio-bg'), bomb: document.getElementById('audio-bomb'), correct: document.getElementById('audio-correct') }
    };

    const initGrid = () => {
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'grid-btn';
            btn.innerHTML = `<span class="btn-text">${i.toString().padStart(2, '0')}</span>`;
            btn.onclick = () => handleChoice(i, btn);
            dom.grid.appendChild(btn);
        }
    };

    const startTurn = () => {
        if (!state.isActive) return;
        dom.labels[1].classList.toggle('is-active', state.currentPlayer === 1);
        dom.labels[2].classList.toggle('is-active', state.currentPlayer === 2);
        state.timeLeft = MAX_TIME;
        clearInterval(state.timer);
        state.timer = setInterval(() => {
            state.timeLeft--;
            dom.timerFill.style.width = (state.timeLeft / MAX_TIME * 100) + '%';
            if (state.timeLeft <= 0) triggerExplosion();
        }, 100);
    };

    const handleChoice = (val, btn) => {
        if (!state.isActive || btn.classList.contains('used')) return;
        btn.classList.add('used');
        if (val === DEATH_VAL) {
            triggerExplosion();
        } else {
            dom.sfx.correct.currentTime = 0; dom.sfx.correct.play();
            state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
            startTurn();
        }
    };

    const triggerExplosion = () => {
        state.isActive = false; clearInterval(state.timer);
        dom.sfx.bg.pause(); dom.sfx.bomb.play();
        const p = state.currentPlayer;
        dom.bombImgs[p].style.visibility = 'hidden';
        dom.expVids[p].style.display = 'block'; dom.expVids[p].play();
        setTimeout(() => { dom.units[p].style.transform = `translateY(-600px) rotate(${p === 1 ? -90 : 90}deg)`; dom.units[p].style.opacity = '0'; }, 200);
        setTimeout(() => {
            const winner = p === 1 ? "NGƯỜI CHƠI 2" : "NGƯỜI CHƠI 1";
            document.getElementById('winner-name').innerText = winner + " WIN";
            document.getElementById('win-screen').style.display = 'flex';
        }, 2500);
    };

    return {
        boot: () => {
            initGrid();
            document.getElementById('btn-ready').onclick = () => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('bg-video').play();
                dom.sfx.bg.volume = 0.3; dom.sfx.bg.play();
                state.isActive = true; startTurn();
            };
        }
    };
})();
window.onload = GameEngine.boot;
</script>
</body>
</html>
